services:
  - type: web
    name: splitmint
    env: node
    rootDir: backend
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: splitmint
          property: host
